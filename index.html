<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Alvaro Choque — Software Engineer</title>
    <meta
      name="description"
      content="Alvaro Choque, software engineer. Mobile apps with Kotlin, Jetpack Compose, Swift and .NET MAUI, built agent-first with TDD and clean architecture."
    />

    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-logang-bot.vercel.app/" />
    <meta property="og:title" content="Alvaro Choque — Software Engineer" />
    <meta
      property="og:description"
      content="Alvaro Choque, software engineer. Mobile apps with Kotlin, Jetpack Compose, Swift and .NET MAUI, built agent-first with TDD and clean architecture."
    />
    <meta property="og:image" content="https://portfolio-logang-bot.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Alvaro Choque, Software Engineer: portfolio home page" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      as="image"
      href="/img_hero_illustration_light.webp"
      media="(prefers-color-scheme: light)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/img_hero_illustration_dark.webp"
      media="(prefers-color-scheme: dark)"
      fetchpriority="high"
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var valid = ['light', 'dark', 'blade-runner', 'pulp-fiction'];
          if (!t || valid.indexOf(t) === -1) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
